<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Standby — Logo Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Space+Mono:wght@400;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --paper:       #EFE9DD;
      --ink:         #1F1A14;
      --accent:      #8B3A24;
      --accent-soft: #C77B5B;
      --amber:       #D4A437;
      --slate:       #0E0B07;
      --serif: 'Fraunces', Georgia, serif;
      --mono:  'Space Mono', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--slate);
    }

    /* ── canvas fills the whole viewport ── */
    #canvas-wrap {
      position: fixed;
      inset: 0;
    }

    #canvas-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── paper grain overlay ── */
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      opacity: 0.38;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(140,110,70,0.07) 0px, transparent 1px),
        radial-gradient(circle at 70% 60%, rgba(120,90,60,0.05) 0px, transparent 1px),
        radial-gradient(circle at 40% 80%, rgba(160,130,80,0.05) 0px, transparent 1px);
      background-size: 3px 3px, 5px 5px, 7px 7px;
    }

  </style>
</head>
<body>

  <div id="canvas-wrap"></div>
  <div id="grain"></div>


  <!-- Three.js from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
  // ── Color Bends — ported from reactbits.dev/backgrounds/color-bends ──

  const MAX_COLORS = 8;

  const FRAG = `
    #define MAX_COLORS ${MAX_COLORS}
    uniform vec2 uCanvas;
    uniform float uTime;
    uniform float uSpeed;
    uniform vec2 uRot;
    uniform int uColorCount;
    uniform vec3 uColors[MAX_COLORS];
    uniform int uTransparent;
    uniform float uScale;
    uniform float uFrequency;
    uniform float uWarpStrength;
    uniform vec2 uPointer;
    uniform float uMouseInfluence;
    uniform float uParallax;
    uniform float uNoise;
    uniform int uIterations;
    uniform float uIntensity;
    uniform float uBandWidth;
    varying vec2 vUv;

    void main() {
      float t = uTime * uSpeed;
      vec2 p = vUv * 2.0 - 1.0;
      p += uPointer * uParallax * 0.1;
      vec2 rp = vec2(p.x * uRot.x - p.y * uRot.y, p.x * uRot.y + p.y * uRot.x);
      vec2 q = vec2(rp.x * (uCanvas.x / uCanvas.y), rp.y);
      q /= max(uScale, 0.0001);
      q /= 0.5 + 0.2 * dot(q, q);
      q += 0.2 * cos(t) - 7.56;
      vec2 toward = (uPointer - rp);
      q += toward * uMouseInfluence * 0.2;

      for (int j = 0; j < 5; j++) {
        if (j >= uIterations - 1) break;
        vec2 rr = sin(1.5 * (q.yx * uFrequency) + 2.0 * cos(q * uFrequency));
        q += (rr - q) * 0.15;
      }

      vec3 col = vec3(0.0);
      float a = 1.0;

      vec2 s = q;
      vec3 sumCol = vec3(0.0);
      float cover = 0.0;
      for (int i = 0; i < MAX_COLORS; ++i) {
        if (i >= uColorCount) break;
        s -= 0.01;
        vec2 r = sin(1.5 * (s.yx * uFrequency) + 2.0 * cos(s * uFrequency));
        float m0 = length(r + sin(5.0 * r.y * uFrequency - 3.0 * t + float(i)) / 4.0);
        float kBelow = clamp(uWarpStrength, 0.0, 1.0);
        float kMix   = pow(kBelow, 0.3);
        float gain   = 1.0 + max(uWarpStrength - 1.0, 0.0);
        vec2 disp    = (r - s) * kBelow;
        vec2 warped  = s + disp * gain;
        float m1 = length(warped + sin(5.0 * warped.y * uFrequency - 3.0 * t + float(i)) / 4.0);
        float m  = mix(m0, m1, kMix);
        float w  = 1.0 - exp(-uBandWidth / exp(uBandWidth * m));
        sumCol += uColors[i] * w;
        cover = max(cover, w);
      }
      col = clamp(sumCol, 0.0, 1.0);
      a   = uTransparent > 0 ? cover : 1.0;

      col *= uIntensity;

      if (uNoise > 0.0001) {
        float n = fract(sin(dot(gl_FragCoord.xy + vec2(uTime), vec2(12.9898, 78.233))) * 43758.5453123);
        col += (n - 0.5) * uNoise;
        col  = clamp(col, 0.0, 1.0);
      }

      vec3 rgb = (uTransparent > 0) ? col * a : col;
      gl_FragColor = vec4(rgb, a);
    }
  `;

  const VERT = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 1.0);
    }
  `;

  // ── Colour presets tuned to the Standby brand ──
  const PRESETS = {
    warm: {
      colors: ['#8B3A24', '#D4A437', '#EFE9DD', '#C77B5B', '#1F1A14', '#5C5346'],
      speed: 0.15, warpStrength: 1.1, frequency: 0.85, intensity: 1.3, bandWidth: 5.5, noise: 0.10
    },
    dusk: {
      colors: ['#2A1A2E', '#8B3A24', '#D4A437', '#EFE9DD', '#4A2035', '#C77B5B'],
      speed: 0.12, warpStrength: 1.3, frequency: 0.75, intensity: 1.4, bandWidth: 6.0, noise: 0.08
    },
    slate: {
      colors: ['#0E0B07', '#1F1A14', '#8B3A24', '#D4A437', '#5C5346', '#EFE9DD'],
      speed: 0.10, warpStrength: 0.9, frequency: 1.0,  intensity: 1.5, bandWidth: 5.0, noise: 0.12
    },
    ember: {
      colors: ['#8B3A24', '#C77B5B', '#D4A437', '#EFE9DD', '#6B2014', '#F2E8D0'],
      speed: 0.18, warpStrength: 1.4, frequency: 0.9,  intensity: 1.6, bandWidth: 6.5, noise: 0.09
    }
  };

  function hexToVec3(hex) {
    const h = hex.replace('#', '');
    return new THREE.Vector3(
      parseInt(h.slice(0,2), 16) / 255,
      parseInt(h.slice(2,4), 16) / 255,
      parseInt(h.slice(4,6), 16) / 255
    );
  }

  // ── Setup Three.js ──
  const container = document.getElementById('canvas-wrap');
  const scene    = new THREE.Scene();
  const camera   = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

  const uColorsArray = Array.from({ length: MAX_COLORS }, () => new THREE.Vector3(0,0,0));

  const material = new THREE.ShaderMaterial({
    vertexShader: VERT,
    fragmentShader: FRAG,
    uniforms: {
      uCanvas:        { value: new THREE.Vector2(1, 1) },
      uTime:          { value: 0 },
      uSpeed:         { value: 0.15 },
      uRot:           { value: new THREE.Vector2(1, 0) },
      uColorCount:    { value: 0 },
      uColors:        { value: uColorsArray },
      uTransparent:   { value: 0 },
      uScale:         { value: 1.0 },
      uFrequency:     { value: 0.85 },
      uWarpStrength:  { value: 1.1 },
      uPointer:       { value: new THREE.Vector2(0, 0) },
      uMouseInfluence:{ value: 0.8 },
      uParallax:      { value: 0.4 },
      uNoise:         { value: 0.10 },
      uIterations:    { value: 3 },
      uIntensity:     { value: 1.3 },
      uBandWidth:     { value: 5.5 }
    },
    transparent: false
  });

  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
  scene.add(mesh);

  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x0e0b07, 1);
  renderer.domElement.style.cssText = 'width:100%;height:100%;display:block;';
  container.appendChild(renderer.domElement);

  function resize() {
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h, false);
    material.uniforms.uCanvas.value.set(w, h);
  }
  resize();
  window.addEventListener('resize', resize);

  // ── Pointer tracking ──
  const pointerTarget  = new THREE.Vector2(0, 0);
  const pointerCurrent = new THREE.Vector2(0, 0);

  window.addEventListener('pointermove', e => {
    const rect = container.getBoundingClientRect();
    pointerTarget.set(
      ((e.clientX - rect.left) / rect.width)  * 2 - 1,
      -(((e.clientY - rect.top) / rect.height) * 2 - 1)
    );
  });

  // ── Apply a preset ──
  function applyPreset(name) {
    const p = PRESETS[name];
    material.uniforms.uSpeed.value         = p.speed;
    material.uniforms.uWarpStrength.value  = p.warpStrength;
    material.uniforms.uFrequency.value     = p.frequency;
    material.uniforms.uIntensity.value     = p.intensity;
    material.uniforms.uBandWidth.value     = p.bandWidth;
    material.uniforms.uNoise.value         = p.noise;

    const vecs = p.colors.slice(0, MAX_COLORS).map(hexToVec3);
    for (let i = 0; i < MAX_COLORS; i++) {
      const v = material.uniforms.uColors.value[i];
      if (i < vecs.length) v.copy(vecs[i]); else v.set(0, 0, 0);
    }
    material.uniforms.uColorCount.value = vecs.length;
  }

  applyPreset('dusk');

// ── Render loop ──
  const clock = new THREE.Clock();
  let autoAngle = Math.PI / 2; // 90°

  (function loop() {
    requestAnimationFrame(loop);
    const dt = clock.getDelta();
    material.uniforms.uTime.value += dt;

    autoAngle += dt * 0.18;
    const c = Math.cos(autoAngle), s = Math.sin(autoAngle);
    material.uniforms.uRot.value.set(c, s);

    pointerCurrent.lerp(pointerTarget, Math.min(1, dt * 6));
    material.uniforms.uPointer.value.copy(pointerCurrent);

    renderer.render(scene, camera);
  })();
  </script>
</body>
</html>
